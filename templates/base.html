<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="csrf-token" content="{{ csrf_token() }}" />
  <title>{% block title %}VaultX — Quản lý Mật khẩu{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}" />
  {% block extra_css %}{% endblock %}
  <style>
    .flash-container { position: fixed; top: 16px; right: 16px; z-index: 9999; display: flex; flex-direction: column; gap: 0.75rem; }
    .flash { padding: 12px 16px; border-radius: 14px; color: #fff; font-size: 0.95rem; box-shadow: 0 16px 40px rgba(0,0,0,0.12); }
    .flash-success { background: #22c55e; }
    .flash-error { background: #ef4444; }
    .flash-info { background: #3b82f6; }
  </style>
</head>
<body>
  <div class="noise-overlay"></div>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div class="flash-container">
        {% for category, message in messages %}
          <div class="flash flash-{{ category }}">{{ message }}</div>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
  <script src="{{ url_for('static', filename='js/base.js') }}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
