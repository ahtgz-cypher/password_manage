  <div class="modal-overlay" id="entryModal" aria-hidden="true" role="dialog" aria-labelledby="modalTitle">
  <div class="modal-box">
    <div class="modal-header">
      <h3 class="modal-title" id="modalTitle">Thêm mục mới</h3>
      <button class="modal-close" id="closeModal" type="button" aria-label="Đóng">
        <svg width="18" height="18" viewBox="0 0 18 18"><path d="M4 4l10 10M14 4L4 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
    </div>

    <form class="modal-form" id="entryForm" novalidate>
      <input type="hidden" id="entryId" name="id" />
      <input type="hidden" id="entryCategory" name="category" value="login" />

      <div class="modal-tabs">
        <button type="button" class="tab-btn active" data-tab="login">Đăng nhập</button>
        <button type="button" class="tab-btn" data-tab="card">Thẻ ngân hàng</button>
        <button type="button" class="tab-btn" data-tab="note">Ghi chú</button>
      </div>

      <div class="tab-pane active" id="tab-login">
        <div class="field-group">
          <label class="field-label" for="entryTitle">Tên website</label>
          <div class="field-wrap">
            <input type="text" id="entryTitle" name="title" class="field-input" placeholder="Ví dụ: Google, Facebook..." />
          </div>
        </div>
        <div class="field-group">
          <label class="field-label" for="entryUrl">URL</label>
          <div class="field-wrap">
            <input type="url" id="entryUrl" name="url" class="field-input" placeholder="https://example.com" />
          </div>
        </div>
        <div class="field-group">
          <label class="field-label" for="entryUsername">Tên đăng nhập / Email</label>
          <div class="field-wrap">
            <input type="text" id="entryUsername" name="username" class="field-input" placeholder="username@email.com" autocomplete="off" />
          </div>
        </div>
        <div class="field-group">
          <label class="field-label" for="entryPassword">Mật khẩu</label>
          <div class="field-wrap">
            <input type="password" name="password" id="entryPassword" class="field-input has-tools" placeholder="Mật khẩu" autocomplete="new-password" />
            <button type="button" class="toggle-pw" aria-label="Hiện mật khẩu" onclick="togglePassword('entryPassword')">
              <svg class="eye-show" width="16" height="16" viewBox="0 0 16 16"><path d="M8 3C4.5 3 1.5 5.5 0 8c1.5 2.5 4.5 5 8 5s6.5-2.5 8-5c-1.5-2.5-4.5-5-8-5zm0 8a3 3 0 110-6 3 3 0 010 6zm0-4.5a1.5 1.5 0 100 3 1.5 1.5 0 000-3z" fill="currentColor"/></svg>
              <svg class="eye-hide" width="16" height="16" viewBox="0 0 16 16" style="display:none"><path d="M13.3 2.7l-1.4-1.4-1.8 1.8A7.9 7.9 0 008 2.5C4.5 2.5 1.5 5 0 7.5c.6 1 1.5 2 2.7 2.8L1.3 11.7l1.4 1.4 10.6-10.4zM5.5 5.5a2.5 2.5 0 013.5 3.5L5.5 5.5zm-1 6l-1.8 1.8 1.4 1.4 1.8-1.8A7.9 7.9 0 008 13.5c3.5 0 6.5-2.5 8-5-.6-1-1.5-2-2.7-2.8l1-1-1.4-1.4L4.5 11.5z" fill="currentColor"/></svg>
            </button>
            <button type="button" class="generate-btn" id="generatePwBtn" title="Tạo mật khẩu ngẫu nhiên">
              <svg width="14" height="14" viewBox="0 0 14 14"><path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="7" cy="7" r="3" stroke="currentColor" stroke-width="1.2" fill="none" opacity=".5"/></svg>
            </button>
          </div>
          <div class="strength-meter" id="entryStrengthMeter" style="display:none">
            <div class="strength-bar"><div class="strength-fill" id="entryStrengthFill"></div></div>
            <span class="strength-label" id="entryStrengthLabel"></span>
          </div>
        </div>
        <div class="field-group">
          <label class="field-label" for="entryNotes">Ghi chú</label>
          <textarea id="entryNotes" name="notes" class="field-input" rows="2" placeholder="Ghi chú thêm"></textarea>
        </div>
      </div>

      <div class="tab-pane" id="tab-card">
        <div class="field-group">
          <label class="field-label" for="cardName">Tên chủ thẻ</label>
          <div class="field-wrap">
            <input type="text" id="cardName" name="card_name" class="field-input" placeholder="NGUYEN VAN A" />
          </div>
        </div>
        <div class="field-group">
          <label class="field-label" for="cardNumber">Số thẻ</label>
          <div class="field-wrap">
            <input type="text" id="cardNumber" name="card_number" class="field-input field-mono" placeholder="0000 0000 0000 0000" maxlength="23" />
          </div>
        </div>
        <div class="field-row">
          <div class="field-group">
            <label class="field-label" for="cardExpiry">Hết hạn</label>
            <div class="field-wrap">
              <input type="text" id="cardExpiry" name="card_expiry" class="field-input field-mono" placeholder="MM/YY" maxlength="5" />
            </div>
          </div>
          <div class="field-group">
            <label class="field-label" for="cardCvv">CVV</label>
            <div class="field-wrap">
              <input type="password" id="cardCvv" name="card_cvv" class="field-input field-mono has-toggle" placeholder="***" maxlength="4" />
              <button type="button" class="toggle-pw" aria-label="Hiện CVV" onclick="togglePassword('cardCvv')">
                <svg class="eye-show" width="16" height="16" viewBox="0 0 16 16"><path d="M8 3C4.5 3 1.5 5.5 0 8c1.5 2.5 4.5 5 8 5s6.5-2.5 8-5c-1.5-2.5-4.5-5-8-5zm0 8a3 3 0 110-6 3 3 0 010 6zm0-4.5a1.5 1.5 0 100 3 1.5 1.5 0 000-3z" fill="currentColor"/></svg>
                <svg class="eye-hide" width="16" height="16" viewBox="0 0 16 16" style="display:none"><path d="M13.3 2.7l-1.4-1.4-1.8 1.8A7.9 7.9 0 008 2.5C4.5 2.5 1.5 5 0 7.5c.6 1 1.5 2 2.7 2.8L1.3 11.7l1.4 1.4 10.6-10.4zM5.5 5.5a2.5 2.5 0 013.5 3.5L5.5 5.5zm-1 6l-1.8 1.8 1.4 1.4 1.8-1.8A7.9 7.9 0 008 13.5c3.5 0 6.5-2.5 8-5-.6-1-1.5-2-2.7-2.8l1-1-1.4-1.4L4.5 11.5z" fill="currentColor"/></svg>
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="tab-pane" id="tab-note">
        <div class="field-group">
          <label class="field-label" for="noteTitle">Tiêu đề</label>
          <div class="field-wrap">
            <input type="text" id="noteTitle" name="note_title" class="field-input" placeholder="Tiêu đề ghi chú..." />
          </div>
        </div>
        <div class="field-group">
          <label class="field-label" for="noteContent">Nội dung bảo mật</label>
          <textarea id="noteContent" name="note_content" class="field-input" rows="5" placeholder="Nội dung riêng tư..."></textarea>
        </div>
      </div>

      <label class="checkbox-wrap modal-favorite">
        <input type="checkbox" name="favorite" id="entryFavorite" />
        <span class="checkbox-custom"></span>
        <span>Đánh dấu yêu thích</span>
      </label>

      <span class="field-error" id="entryFormError"></span>

      <div class="modal-footer">
        <button type="button" class="btn-ghost" id="cancelModal">Hủy</button>
        <button type="submit" class="btn-primary btn-sm" id="saveEntryBtn">
          <span class="btn-text">Lưu</span>
          <span class="btn-loader" style="display:none"></span>
        </button>
      </div>
    </form>
  </div>
</div>
